# User-visible strings for the simulation UI.
#
# English is the base bundle, so the file carries no locale suffix: adding
# messages_es.properties beside it is all a translation needs. Keys are grouped
# by surface so a translator can work one panel at a time.
#
# Values read through MessageFormat follow its quoting rules, so a value with an
# apostrophe must double it. No current value has one, and new ones should avoid
# apostrophes rather than depend on that detail.

# --- Window and splash ---------------------------------------------------------
window.title=JShorelark
splash.loading=Loading...

# --- Menu ----------------------------------------------------------------------
menu.file=File
menu.view=View
menu.help=Help
menu.reset=Reset
menu.exit=Exit
menu.darkTheme=Dark Theme
menu.soundEffects=Sound Effects
menu.about=About

# --- Controls ------------------------------------------------------------------
controls.pause=Pause simulation (Space)
controls.resume=Resume simulation (Space)
controls.reset=Reset simulation (R)
controls.addFood=Add more food (F)
controls.toggleSound=Toggle sound (M)
controls.speed=Simulation speed
controls.volume=Sound volume
controls.generation=Generation: {0,number,#}
controls.population=Population: {0,number,#}
controls.bestFitness=Best fitness: {0}
controls.progress=Generation progress

# --- Bird inspector ------------------------------------------------------------
inspector.position=Position: ({0}, {1})
inspector.rotation=Rotation: {0}
inspector.fitness=Fitness: {0}

# --- Charts --------------------------------------------------------------------
chart.generation=Generation
chart.fitness=Fitness
chart.max=Max
chart.avg=Avg
chart.median=Median
chart.min=Min

# --- About dialog --------------------------------------------------------------
# The {0} marker is where the hyperlink goes, so a translation may place it anywhere.
about.title=JShorelark
about.version=Version {0}
about.description=A Java port of {0}, a bird evolution simulation originally written in Rust.
about.link.upstream=Shorelark
about.basedOn=Based on the blog post series {0} by Patryk Wychowaniec.
about.link.blog=Learning to Fly
