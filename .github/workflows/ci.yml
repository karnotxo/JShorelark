name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to the same ref cancels the previous run; verifying a stale commit is wasted CPU.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on JDK ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform, do not stop at the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # `verify` is the whole gate: Spotless, Checkstyle and the enforcer run at `validate`,
      # JaCoCo and SpotBugs at `verify`, PMD/CPD at `verify`. Running the phases separately would
      # duplicate work without adding coverage.
      - name: Build and verify
        run: mvn -B -ntp verify

      # Reports only exist when a gate failed, which is exactly when they are needed.
      - name: Upload quality reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/target/checkstyle-result.xml
            **/target/pmd.xml
            **/target/cpd.xml
            **/target/spotbugsXml.xml
            **/target/surefire-reports/**
            **/target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 7
